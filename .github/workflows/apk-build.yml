name: Build APK (CI)

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    name: Build production APK
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read Flutter Version
        id: flutter_version
        run: |
          FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)
          echo "Flutter version detected: $FLUTTER_VERSION"
          echo "flutter-version=$FLUTTER_VERSION" >> "$GITHUB_ENV"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set Up Rust
        working-directory: packages/foundation/fast_image/rust
        run: rustup show active-toolchain

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Set Up NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      # No release keystore is configured on this branch. mobile/android/app/build.gradle.kts
      # falls back to the Android debug keystore, which is fine for a test APK.
      - name: Build Release APK
        working-directory: mobile
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --flavor production --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moodiary-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-production-release.apk
          if-no-files-found: error
          retention-days: 14
